<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geometra Ligi Simone - SPA</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #b85c38;
      --secondary: #fbeee0;
      --accent: #6f4e37;
      --text: #222;
      --white: #fff;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.07);
      --gradient: linear-gradient(90deg, #b85c38 0%, #fbeee0 100%);
      --gradient-btn: linear-gradient(90deg, #b85c38 0%, #6f4e37 100%);
    }

    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', Arial, sans-serif;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: url('https://www.transparenttextures.com/patterns/blueprint.png'), linear-gradient(120deg, #fbeee0 0%, #b85c38 100%);
      background-size: 340px, 200% 200%;
      background-repeat: repeat, no-repeat;
      animation: bgmove 12s ease-in-out infinite alternate;
    }
    @keyframes bgmove {
      0% { background-position: 0 0, 0% 50%; }
      100% { background-position: 0 0, 100% 50%; }
    }
    main {
      flex: 1 0 auto;
      min-height: 70vh;
      background: var(--secondary);
      margin: 0;
      padding: 0;
    }
    .page {
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s cubic-bezier(.4,0,.2,1), transform 0.7s cubic-bezier(.4,0,.2,1);
      background: var(--secondary);
      margin: 0;
      padding: 0;
    }
    .page.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    /* Header e Navbar */
    header {
      background: #1E254E;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      min-height: 96px;
    }
    .logo-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .logo-header img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 16px #b85c38;
      border: 3px solid #fff;
      object-fit: cover;
    }
    .logo-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
    .logo-title { font-family: 'Montserrat', Arial, sans-serif; font-size: 1.5rem; font-weight: 900; color: #fff; letter-spacing: 2px; text-transform: uppercase; }
    .logo-subtitle { font-family: 'Montserrat', Arial, sans-serif; font-size: 1.1rem; font-weight: 700; color: #FFF9B1; letter-spacing: 1px; margin-top: 2px; text-transform: uppercase; }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
      transition: transform 0.35s cubic-bezier(.4,0,.2,1), opacity 0.35s;
    }
    .nav-links li a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      transition: color 0.2s;
      cursor: pointer;
      position: relative;
    }
    .nav-links li a.active,
    .nav-links li a:hover {
      color: #FFF9B1;
    }

    /* Hamburger button */
    .hamburger {
      display: none;
      width: 42px;
      height: 42px;
      cursor: pointer;
      background: none;
      border: none;
      position: relative;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 0;
      z-index: 300;
      transition: transform 0.35s cubic-bezier(.4,0,.2,1);
    }
    .hamburger span {
      display: block;
      width: 26px;
      height: 4px;
      background: #FFF9B1;
      border-radius: 2px;
      transition: 0.28s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    .hamburger.open {
      transform: rotate(90deg) scale(1.16);
    }

    @media (max-width: 700px) {
      .nav-links {
        position: absolute;
        top: 80px;
        right: 0;
        width: 180px;
        background: #1E254E;
        flex-direction: column;
        padding: 1rem 0;
        border-radius: 10px;
        box-shadow: 0 8px 32px rgba(184,92,56,0.16);
        transform: translateY(-40px);
        opacity: 0;
        pointer-events: none;
        display: flex !important; /* Always flex to keep structure for animation */
      }
      .nav-links.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }
      .nav-links li {
        padding: 0.75rem 1.5rem;
      }
      .nav-links li a {
        font-size: 1.25rem;
      }
      .hamburger {
        display: flex;
      }
    }

    /* Animazioni generali */
    .section-animate { opacity: 0; transform: translateY(60px) scale(0.98); transition: opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1); will-change: opacity, transform; }
    .section-animate.in-view { opacity: 1; transform: translateY(0) scale(1); }
    .slide-in-left { opacity: 0; transform: translateX(-80px); transition: opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1); }
    .slide-in-left.in-view { opacity: 1; transform: translateX(0); }
    .slide-in-right { opacity: 0; transform: translateX(80px); transition: opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1); }
    .slide-in-right.in-view { opacity: 1; transform: translateX(0); }

    /* Footer */
    footer {
      background: var(--accent);
      color: var(--white);
      padding: 1.2rem 2rem 0.5rem 2rem;
      flex-shrink: 0;
      margin: 0;
      padding-top: 0;
      border-top: none;
    }
    /* Resto del CSS invariato (header, main, servizi, profilo, contatti, ecc.) */
    /* Puoi integrare quello già fornito prima qui */
  </style>
</head>

<script>
  // SPA Navigation
  function navigateTo(pageId, event) {
    if(event) event.preventDefault();
    document.querySelectorAll('.page').forEach(page=>page.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(a=>{
      if(a.getAttribute('onclick') && a.getAttribute('onclick').includes(pageId)) {
        a.classList.add('active');
      }
    });
    document.getElementById('navLinks').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  const hamburger = document.getElementById("hamburger");
  hamburger.addEventListener("click", function() {
    document.getElementById("navLinks").classList.toggle("open");
    hamburger.classList.toggle("open");
  });

  // Altre funzioni come renderServices, animateSections, form validation...
</script>
